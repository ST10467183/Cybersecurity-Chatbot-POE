name: .NET Framework 4.7.2 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore CybersecurityChatbot.slnx

    - name: Build the WPF application
      run: msbuild CybersecurityChatbot.csproj /p:Configuration=Release /p:TargetFrameworkVersion=v4.7.2