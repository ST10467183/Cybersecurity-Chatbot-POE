name: .NET Framework WPF Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
    
    - name: Restore NuGet packages
      run: nuget restore CybersecurityChatbot.sln
    
    - name: Build WPF Application
      run: msbuild CybersecurityChatbot.csproj /p:Configuration=Release /p:OutputPath=bin\Release /t:Build
      working-directory: ./CybersecurityChatbot